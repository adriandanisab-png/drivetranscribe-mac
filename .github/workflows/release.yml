# Publishes a GitHub release with the DMG whenever the DMG or VERSION changes on main
# (or when run by hand). The tag comes from the VERSION file. The website links to
# releases/latest/download/DriveTranscribe-beta.dmg, so the newest release is what people get.
name: Publish release

on:
  push:
    branches: [main]
    paths: ["DriveTranscribe-beta.dmg", "VERSION", "RELEASE_NOTES.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < VERSION)"
          test -n "$TAG" && test -s DriveTranscribe-beta.dmg
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version again: replace the DMG and notes.
            gh release upload "$TAG" DriveTranscribe-beta.dmg --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" DriveTranscribe-beta.dmg \
              --target "$GITHUB_SHA" \
              --title "DriveTranscribe for Mac ${TAG#v}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
